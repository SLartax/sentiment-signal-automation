name: Daily Sentiment Signal
  
# DISABLED: automatic sentiment emails stopped by user request (2026-10-14).
# The LegalBandi workflow in this same repo remains unchanged.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-signal:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run sentiment analysis and send email
        env:
          # Secrets configurati nelle impostazioni del repository
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          EMAIL_FROM: ${{ secrets.SENDER_EMAIL }}
          EMAIL_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          EMAIL_TO: ${{ secrets.RECIPIENT_EMAIL }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
        run: |
          python send_signal_email.py
      
      - name: Log completion
        if: always()
        run: |
          echo "Workflow completato alle $(date)"
